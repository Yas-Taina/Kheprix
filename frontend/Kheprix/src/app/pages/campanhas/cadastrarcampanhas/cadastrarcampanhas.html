<div class="page-container">

  <div class="page-header">
    <h1>N<span class="sc">ova</span> C<span class="sc">ampanha</span></h1>
    <div class="divider">❧</div>
  </div>

  <!-- Nome -->
  <div class="form-group">
    <label class="field-label">Nome da Campanha</label>
    <input class="field-input" type="text" [(ngModel)]="nome" placeholder="Placeholder" />
  </div>

  <!-- Data Início -->
  <div class="form-group">
    <label class="field-label">Data de Início</label>
    <div class="date-row">
      <input class="field-input date-input" type="date" [(ngModel)]="dataInicio" />
      <span class="cal-icon">&#128197;</span>
    </div>
  </div>

  <!-- Data Fim -->
  <div class="form-group">
    <label class="field-label">Data de Fim <span class="opcional">(opcional)</span></label>
    <div class="date-row">
      <input class="field-input date-input" type="date" [(ngModel)]="dataFim" />
      <span class="cal-icon">&#128197;</span>
    </div>
  </div>

  <!-- Variáveis da Campanha -->
  <div *ngIf="variaveis.length > 0">
    <label class="field-label">Variáveis da Campanha</label>
    <div class="var-item" *ngFor="let v of variaveis">
      <label class="field-label-sm">{{ v.variavel.nome }}</label>
      <div class="var-input-row">
        <input class="field-input var-input" [(ngModel)]="v.valor" placeholder="Placeholder" />
        <span class="var-metrica">{{ v.variavel.metrica || '' }}</span>
      </div>
    </div>
  </div>

  <!-- Descrição -->
  <div class="form-group" style="margin-top:16px">
    <label class="field-label">Descrição</label>
    <textarea class="field-input" [(ngModel)]="descricao" placeholder="Placeholder"></textarea>
  </div>

  <div class="error-msg" *ngIf="erro">{{ erro }}</div>

  <div class="form-footer">
    <button class="btn-primary" (click)="confirmar()" [disabled]="carregando">
      {{ carregando ? 'Salvando...' : 'Confirmar' }}
    </button>
    <button class="back-btn" (click)="voltar()">&#9664;</button>
  </div>

</div>
