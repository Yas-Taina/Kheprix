<div class="page-container" style="max-width: 1100px; min-height: 85vh">
  <div class="convites-layout">
    <div class="convites-section">
      <h1 class="page-title" style="font-size: 1.6rem">
        Convites de Colaboração
      </h1>
      <div class="ornament-divider"><span>⸙</span></div>

      <div *ngIf="loading" class="loading-overlay">
        <div class="spinner"></div>
      </div>

      <ng-container *ngIf="!loading">
        <div *ngIf="convites.length === 0" class="text-muted text-center mt-lg">
          Nenhum convite pendente.
        </div>
        <table class="data-table" *ngIf="convites.length > 0">
          <thead>
            <tr>
              <th>Nome do Estudo</th>
              <th>Remetente</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of convites">
              <td>{{ c.nome_estudo }}</td>
              <td>{{ c.nome_remetente }}</td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-primary btn-sm" (click)="aceitar(c)">
                    Aceitar
                  </button>
                  <button class="btn btn-danger btn-sm" (click)="recusar(c)">
                    Recusar
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </ng-container>

      <div *ngIf="msgConvite" class="alert alert-success mt-md">
        {{ msgConvite }}
      </div>
      <div *ngIf="erroConvite" class="alert alert-error mt-md">
        {{ erroConvite }}
      </div>
    </div>

    <div class="autocadastro-section">
      <h2 class="page-title" style="font-size: 1.3rem">
        Autocadastro<br />em Estudo
      </h2>
      <div class="ornament-divider"><span>⸙</span></div>

      <div class="form-group">
        <label class="form-label">Código</label>
        <div class="form-inline-group">
          <input
            class="form-control"
            type="text"
            [(ngModel)]="codigoAcesso"
            placeholder="Código do estudo"
          />
          <button
            class="btn-icon"
            (click)="lerQrCode()"
            title="Ler QR Code"
            style="font-size: 1.5rem; color: var(--color-text-primary)"
          >
            <svg
              fill="currentColor"
              width="24"
              height="24"
              id="Layer_1"
              data-name="Layer 1"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 122.61 122.88"
            >
              <title>Ler QRCoded</title>
              <path
                d="M23.38,0h13V11.15h-13a12.22,12.22,0,0,0-8.64,3.57l0,0a12.22,12.22,0,0,0-3.57,8.64V39.32H0V23.38A23.32,23.32,0,0,1,6.86,6.89l0,0A23.31,23.31,0,0,1,23.38,0ZM3.25,54.91H119.36a3.29,3.29,0,0,1,3.25,3.27V64.7A3.29,3.29,0,0,1,119.36,68H3.25A3.28,3.28,0,0,1,0,64.7V58.18a3.27,3.27,0,0,1,3.25-3.27ZM90.57,0h8.66a23.28,23.28,0,0,1,16.49,6.86v0a23.32,23.32,0,0,1,6.87,16.52V39.32H111.46V23.38a12.2,12.2,0,0,0-3.6-8.63v0a12.21,12.21,0,0,0-8.64-3.58H90.57V0Zm32,81.85V99.5a23.46,23.46,0,0,1-23.38,23.38H90.57V111.73h8.66A12.29,12.29,0,0,0,111.46,99.5V81.85Zm-86.23,41h-13A23.32,23.32,0,0,1,6.86,116l-.32-.35A23.28,23.28,0,0,1,0,99.5V81.85H11.15V99.5a12.25,12.25,0,0,0,3.35,8.41l.25.22a12.2,12.2,0,0,0,8.63,3.6h13v11.15Z"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input
          class="form-control"
          type="password"
          [(ngModel)]="senhaAcesso"
          placeholder="Senha de acesso"
        />
      </div>

      <div *ngIf="erroAcesso" class="alert alert-error mt-sm">
        {{ erroAcesso }}
      </div>
      <div *ngIf="msgAcesso" class="alert alert-success mt-sm">
        {{ msgAcesso }}
      </div>

      <button
        class="btn btn-primary btn-full mt-md"
        (click)="ingressarEstudo()"
        [disabled]="loadingAcesso"
      >
        {{ loadingAcesso ? "Cadastrando..." : "Cadastrar" }}
      </button>
    </div>
  </div>
</div>

<div
  *ngIf="scannerAtivo"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  "
>
  <div
    style="
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
    "
  >
    <video #video width="300"></video>

    <button class="btn btn-secondary mt-md" (click)="fecharScanner()">
      Cancelar
    </button>
  </div>
</div>
