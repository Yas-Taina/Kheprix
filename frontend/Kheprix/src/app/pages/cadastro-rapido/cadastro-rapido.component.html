<div class="page-container" style="max-width: 700px; min-height: 85vh">
  <h1 class="page-title">Cadastro Rápido de Registros</h1>
  <div class="ornament-divider"><span>⸙</span></div>

  <div class="form-group">
    <label class="form-label">Estudo</label>
    <select
      class="form-control"
      [(ngModel)]="estudoId"
      (ngModelChange)="onEstudoChange()"
    >
      <option value="">Estudos</option>
      <option *ngFor="let e of estudos" [value]="e.id">{{ e.nome }}</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Campanha de Coleta de Dados</label>
    <select
      class="form-control"
      [(ngModel)]="campanhaId"
      (ngModelChange)="onCampanhaChange()"
      [disabled]="!estudoId"
    >
      <option value="">Campanhas</option>
      <option *ngFor="let c of campanhas" [value]="c.id">{{ c.nome }}</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Unidade Amostral</label>
    <select
      class="form-control"
      [(ngModel)]="unidadeId"
      (ngModelChange)="onUnidadeChange()"
      [disabled]="!campanhaId"
    >
      <option value="">Unidades</option>
      <option *ngFor="let u of unidades" [value]="u.id">{{ u.nome }}</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Evento de Amostragem</label>
    <select class="form-control" [(ngModel)]="eventoId" [disabled]="!unidadeId">
      <option value="">Eventos</option>
      <option *ngFor="let ev of eventos" [value]="ev.id">
        {{ util.formatDateTime(ev.horario_inicio) }}
      </option>
    </select>
  </div>

  <div class="text-center mt-lg">
    <button
      class="btn btn-primary"
      (click)="prosseguir()"
      [disabled]="!eventoId"
    >
      Prosseguir
    </button>
  </div>
</div>
