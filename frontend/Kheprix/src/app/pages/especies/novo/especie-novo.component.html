        </div>
        <img *ngIf="fotoPreview" [src]="fotoPreview" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-top:8px" />
      </div>

      <div class="form-row three-col">
        <div class="form-group">
          <label class="form-label">Classe</label>
          <input class="form-control" type="text" [(ngModel)]="classe" placeholder="Insecta" value="Insecta"/>
        </div>
        <div class="form-group">
          <label class="form-label">Ordem</label>
          <input class="form-control" type="text" [(ngModel)]="ordem" placeholder="Classe da Espécie" />
        </div>
        <div class="form-group">
          <label class="form-label">Família</label>
          <input class="form-control" type="text" [(ngModel)]="familia" placeholder="Familia da Espécie" />
        </div>
      </div>

      <div class="form-row three-col">
        <div class="form-group">
          <label class="form-label">Gênero</label>
          <input class="form-control" type="text" [(ngModel)]="genero" placeholder="Gênero da Espécie" />
        </div>
        <div class="form-group">
          <label class="form-label">Espécie</label>
          <input class="form-control" type="text" [(ngModel)]="especie" placeholder="Espécie" />
        </div>
        <div class="form-group">
          <label class="form-label">Nome Popular</label>
          <input class="form-control" type="text" [(ngModel)]="nomePopular" placeholder="Nome Popular" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Status de Conservação</label>
        <select class="form-control" [(ngModel)]="statusConservacao">
          <option *ngFor="let s of statusList" [value]="s.value">{{ s.label }}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="orb-checkbox">
          <input type="checkbox" [(ngModel)]="endemismo" />
          <span class="orb-indicator"></span>
          A espécie é nativa da região
        </label>
      </div>

      <div *ngIf="erro" class="alert alert-error">{{ erro }}</div>

      <div class="d-flex align-center justify-between mt-lg">
        <button class="back-btn" (click)="voltar()">◀</button>
        <button class="btn btn-primary" (click)="salvar()" [disabled]="loading">
          {{ loading ? 'Salvando...' : 'Confirmar' }}
        </button>
      </div>
    </div>
