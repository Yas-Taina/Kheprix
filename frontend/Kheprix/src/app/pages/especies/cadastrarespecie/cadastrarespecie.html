<div class="page-container">

  <div class="page-header">
    <h1>C<span class="sc">adastro de</span> E<span class="sc">spécies</span></h1>
    <div class="divider">❧</div>
  </div>

  <!-- Foto -->
  <div class="form-group">
    <label class="field-label">Foto</label>
    <div class="foto-row">
      <input class="field-input foto-input" [value]="nomeArquivoFoto || ''" placeholder="Placeholder.jpeg" readonly />
      <button class="icon-btn primary" title="Escolher arquivo" (click)="abrirArquivo()">&#128193;</button>
      <button class="icon-btn primary" title="Abrir câmera" (click)="abrirCamera()">&#128247;</button>
    </div>
    <!-- input file oculto -->
    <input #fileInput type="file" accept="image/*" style="display:none" (change)="onArquivoSelecionado($event)" />
  </div>

  <!-- Modal câmera -->
  <div class="camera-modal" *ngIf="mostrarCamera">
    <div class="camera-inner">
      <video #videoEl autoplay playsinline class="camera-video"></video>
      <canvas #canvasEl style="display:none"></canvas>
      <div class="camera-btns">
        <button class="btn-primary" (click)="tirarFoto()">&#128247; Tirar Foto</button>
        <button class="btn-secondary" (click)="fecharCamera()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Classe / Ordem / Família -->
  <div class="grid-3">
    <div>
      <label class="field-label-sm">Classe</label>
      <input class="field-input" [(ngModel)]="classe" placeholder="Insecta" />
    </div>
    <div>
      <label class="field-label-sm">Ordem</label>
      <input class="field-input" [(ngModel)]="ordem" placeholder="Placeholder" />
    </div>
    <div>
      <label class="field-label-sm">Família</label>
      <input class="field-input" [(ngModel)]="familia" placeholder="Placeholder" />
    </div>
  </div>

  <!-- Gênero / Espécie / Nome Popular -->
  <div class="grid-3" style="margin-top:16px">
    <div>
      <label class="field-label-sm">Gênero</label>
      <input class="field-input" [(ngModel)]="genero" placeholder="Placeholder" />
    </div>
    <div>
      <label class="field-label-sm">Espécie</label>
      <input class="field-input" [(ngModel)]="especie" placeholder="Placeholder" />
    </div>
    <div>
      <label class="field-label-sm">Nome Popular</label>
      <input class="field-input" [(ngModel)]="nomePopular" placeholder="Placeholder" />
    </div>
  </div>

  <!-- Status de Conservação -->
  <div class="form-group" style="margin-top:16px; max-width:340px">
    <label class="field-label">Status de Conservação</label>
    <select class="field-input" [(ngModel)]="statusConservacao">
      <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
    </select>
  </div>

  <!-- Endemismo -->
  <div class="endemismo-row">
    <label class="radio-custom">
      <input type="checkbox" [(ngModel)]="endemismo" />
      <span class="radio-dot"></span>
      A espécie é nativa da região
    </label>
  </div>

  <div class="error-msg" *ngIf="erro">{{ erro }}</div>

  <div class="form-footer">
    <button class="btn-primary" (click)="confirmar()" [disabled]="carregando">
      {{ carregando ? 'Salvando...' : 'Confirmar' }}
    </button>
    <button class="back-btn" (click)="voltar()">&#9664;</button>
  </div>

</div>
