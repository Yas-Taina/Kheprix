<div class="page-container">
  <h2 class="page-subtitle">{{ nomeEstudo }}</h2>
  <h1 class="page-title">Espécies</h1>
  <div class="ornament-divider"><span>⸙</span></div>

  <div class="page-header-row">
    <button
      class="btn btn-primary"
      (click)="router.navigate(['/estudos', estudoId, 'especies', 'novo'])"
    >
      Adicionar Espécie
      <svg
        class="svg-icon"
        width="24"
        height="24"
        style="vertical-align: middle; overflow: hidden"
        fill="currentColor"
        viewBox="0 0 1024 1024"
        version="1.1"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M512 65.6c247.424 0 448 200.576 448 448S759.424 961.6 512 961.6 64 761.024 64 513.6 264.576 65.6 512 65.6z m0 48C291.0864 113.6 112 292.6864 112 513.6s179.0864 400 400 400 400-179.0864 400-400S732.9136 113.6 512 113.6z m0 209.6c13.2544 0 24 10.7456 24 24v144h144c13.2544 0 24 10.7456 24 24 0 13.2544-10.7456 24-24 24h-144.0016l0.0016 144c0 13.2544-10.7456 24-24 24-13.2544 0-24-10.7456-24-24l-0.0016-144H344c-13.2544 0-24-10.7456-24-24 0-13.2544 10.7456-24 24-24h144v-144c0-13.2544 10.7456-24 24-24z"
          fill="currentColor"
        />
      </svg>
    </button>
    <button class="back-btn" (click)="router.navigate(['/estudos', estudoId])">
      ◀
    </button>
  </div>

  <div class="filter-bar">
    <span class="filter-label">Buscar por:</span>
    <select class="form-control" style="min-width: 180px">
      <option>Nome da Espécie</option>
    </select>
    <input
      class="form-control"
      type="text"
      [(ngModel)]="busca"
      placeholder="Digite sua busca..."
      style="flex: 1"
      (keyup.enter)="filtrar()"
    />
    <button class="btn-icon" (click)="filtrar()">
      <svg
        fill="currentColor"
        alt="Buscar"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        style="transform: scale(1)"
      >
        <path
          d="M16.32 14.9l5.39 5.4a1 1 0 0 1-1.42 1.4l-5.38-5.38a8 8 0 1 1 1.41-1.41zM10 16a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"
        ></path>
      </svg>
    </button>
  </div>

  <div *ngIf="loading" class="loading-overlay"><div class="spinner"></div></div>

  <table class="data-table" *ngIf="!loading">
    <thead>
      <tr>
        <th style="width: 60px"></th>
        <th>Nome Científico</th>
        <th>Nome Popular</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of especies" (click)="verDetalhe(e)">
        <td>
          <img
            [src]="e.foto ? util.buildFotoUrl(apiUrl, e.foto) : placeholderImg"
            class="species-photo-circle"
            alt="{{ e.nome_popular }}"
          />
        </td>
        <td>
          <em>{{ e.genero }} {{ e.especie }}</em>
        </td>
        <td>{{ e.nome_popular }}</td>
      </tr>
    </tbody>
  </table>
  <div
    *ngIf="!loading && especies.length === 0"
    class="text-center text-muted mt-lg"
  >
    Nenhuma espécie cadastrada.
  </div>
</div>
