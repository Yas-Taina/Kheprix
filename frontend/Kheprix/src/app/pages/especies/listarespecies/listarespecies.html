<div class="page-container">

  <div class="page-header">
    <h2>{{ nomeEstudo }}</h2>
    <h1>E<span class="sc">spécies</span></h1>
    <div class="divider">❧</div>
  </div>

  <div class="actions-row">
    <button class="badge-btn" (click)="novaEspecie()">
      Adicionar Espécie <span class="plus">+</span>
    </button>
    <button class="back-btn" (click)="voltar()">&#9664;</button>
  </div>

  <div class="search-row">
    <span class="search-label">Buscar por:</span>
    <select class="field-input search-select" [(ngModel)]="busca">
      <option value="">Nome da Espécie</option>
    </select>
    <input class="field-input search-input" [(ngModel)]="busca" (ngModelChange)="pesquisar()" placeholder="Digite sua busca..." />
    <button class="icon-btn primary">&#128269;</button>
    <button class="icon-btn primary">&#9927;</button>
  </div>

  <div *ngIf="carregando" class="loading-msg">Carregando...</div>
  <div *ngIf="erro" class="error-msg">{{ erro }}</div>

  <table class="kheprix-table" *ngIf="!carregando">
    <thead>
      <tr>
        <th></th>
        <th style="text-align:center">Nome Científico</th>
        <th style="text-align:right">Nome Popular</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of filtradas" (click)="abrirDetalhe(e)">
        <td>
          <img
            *ngIf="e.foto"
            [src]="e.foto"
            class="species-photo"
            [alt]="e.nome_popular"
            (error)="e.foto = ''"
          />
          <div *ngIf="!e.foto" class="species-photo photo-placeholder"></div>
        </td>
        <td style="text-align:center; font-style:italic;">{{ formatNomeCientifico(e) }}</td>
        <td style="text-align:right">{{ e.nome_popular || '—' }}</td>
      </tr>
    </tbody>
  </table>

</div>

<div class="toast" *ngIf="toast">{{ toast }}</div>
