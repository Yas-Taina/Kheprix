    <div class="page-container" style="max-width:750px">
      <h1 class="page-title">{{ isEdit ? 'Editar Estudo' : 'Novo Estudo' }}</h1>
      <div class="ornament-divider"><span>⸙</span></div>

      <div class="form-group">
        <label class="form-label">Nome do estudo</label>
        <input class="form-control" type="text" [(ngModel)]="nome" placeholder="Nome do estudo" />
      </div>

      <ng-container *ngIf="!isEdit">
        <div class="d-flex align-center justify-between mb-md">
          <label class="form-label" style="margin:0">Variáveis Estudadas</label>
          <button class="btn-icon" (click)="addVariavel()" title="Adicionar variável" style="font-size:1.4rem; color:var(--color-btn-primary)"><svg class="svg-icon" width= "24" height="24" style="vertical-align: middle; overflow: hidden;" fill="currentColor" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M512 65.6c247.424 0 448 200.576 448 448S759.424 961.6 512 961.6 64 761.024 64 513.6 264.576 65.6 512 65.6z m0 48C291.0864 113.6 112 292.6864 112 513.6s179.0864 400 400 400 400-179.0864 400-400S732.9136 113.6 512 113.6z m0 209.6c13.2544 0 24 10.7456 24 24v144h144c13.2544 0 24 10.7456 24 24 0 13.2544-10.7456 24-24 24h-144.0016l0.0016 144c0 13.2544-10.7456 24-24 24-13.2544 0-24-10.7456-24-24l-0.0016-144H344c-13.2544 0-24-10.7456-24-24 0-13.2544 10.7456-24 24-24h144v-144c0-13.2544 10.7456-24 24-24z" fill="currentColor" /></svg></button>
        </div>

        <div class="variable-group" *ngFor="let v of variaveis; let i = index">
          <button class="variable-remove-btn" (click)="removeVariavel(i)" title="Remover">✖</button>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Nome</label>
              <input class="form-control" type="text" [(ngModel)]="v.nome" placeholder="Nome da variável" />
            </div>
            <div class="form-group">
              <label class="form-label">Nível do Estudo</label>
              <select class="form-control" [(ngModel)]="v.nivel_aplicacao">
                <option value="campanha">Campanha</option>
                <option value="unidade">Unidade Amostral</option>
                <option value="evento">Evento de Amostragem</option>
                <option value="registro">Registro de Ocorrência</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tipo de Dado</label>
              <select class="form-control" [(ngModel)]="v.tipo_dado">
                <option value="numerico">Numérico</option>
                <option value="texto">Texto</option>
                <option value="logico">Lógico</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Métrica</label>
              <input class="form-control" type="text" [(ngModel)]="v.metrica" placeholder="Ex: °C, m², kg" />
            </div>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="isEdit && variaveisEdit.length > 0">
        <label class="form-label">Variáveis cadastradas (não editáveis)</label>
        <div class="variable-group" *ngFor="let v of variaveisEdit" style="opacity:0.7">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Nome</label>
              <input class="form-control" [value]="v.nome" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Nível</label>
              <input class="form-control" [value]="v.nivel_aplicacao" readonly />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tipo</label>
              <input class="form-control" [value]="v.tipo_dado" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Métrica</label>
              <input class="form-control" [value]="v.metrica" readonly />
            </div>
          </div>
        </div>
      </ng-container>

      <div class="form-group">
        <label class="form-label">Observações</label>
        <textarea class="form-control" [(ngModel)]="observacoes" placeholder="Observações" rows="4"></textarea>
      </div>

      <div *ngIf="erro" class="alert alert-error">{{ erro }}</div>

      <div class="d-flex align-center justify-between mt-lg">
        <button class="back-btn" (click)="router.navigate(['/estudos'])">◀</button>
        <button class="btn btn-primary" (click)="salvar()" [disabled]="loading">
          {{ loading ? 'Salvando...' : 'Confirmar' }}
        </button>
      </div>
    </div>
