    <!-- To do: ajustar ordem dos formularios -->
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
 

      <fieldset class="fieldset">
        <legend>Dados gerais</legend>
 
        <div class="field">
          <label for="nome">Nome do estudo *</label>
          <input id="nome" type="text" formControlName="nome" placeholder="Ex.: Monitoramento de anfíbios" />
          <span class="field-error" *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">
            Nome obrigatório.
          </span>
        </div>
 
        <div class="field">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" formControlName="observacoes" rows="3"
            placeholder="Informações adicionais sobre o estudo…"></textarea>
        </div>
      </fieldset>
 
      <fieldset class="fieldset">
        <legend>Variáveis</legend>
 
        <div formArrayName="variaveis">
          <div
            *ngFor="let variavel of variaveis.controls; let i = index"
            [formGroupName]="i"
            class="variavel-card">
 
            <div class="variavel-header">
              <span class="variavel-label">Variável {{ i + 1 }}</span>
              <button
                type="button"
                class="btn-remove"
                (click)="removerVariavel(i)"
                [disabled]="variaveis.length === 1"
                title="Remover variável">
                ✕
              </button>
            </div>
 
            <div class="fields-grid">
 
              <div class="field">
                <label [for]="'var-nome-' + i">Nome *</label>
                <input [id]="'var-nome-' + i" type="text" formControlName="nome"
                  placeholder="Ex.: Temperatura" />
                <span class="field-error"
                  *ngIf="variavel.get('nome')?.invalid && variavel.get('nome')?.touched">
                  Nome obrigatório.
                </span>
              </div>
 
              <div class="field">
                <label [for]="'var-nivel-' + i">Nível de aplicação *</label>
                <select [id]="'var-nivel-' + i" formControlName="nivel_aplicacao">
                  <option value="">Selecione…</option>
                  <option *ngFor="let n of niveisAplicacao" [value]="n">{{ n | titlecase }}</option>
                </select>
                <span class="field-error"
                  *ngIf="variavel.get('nivel_aplicacao')?.invalid && variavel.get('nivel_aplicacao')?.touched">
                  Obrigatório.
                </span>
              </div>
 
              <div class="field">
                <label [for]="'var-tipo-' + i">Tipo de dado *</label>
                <select [id]="'var-tipo-' + i" formControlName="tipo_dado">
                  <option value="">Selecione…</option>
                  <option *ngFor="let t of tiposDado" [value]="t">{{ t | titlecase }}</option>
                </select>
                <span class="field-error"
                  *ngIf="variavel.get('tipo_dado')?.invalid && variavel.get('tipo_dado')?.touched">
                  Obrigatório.
                </span>
              </div>
 
              <div class="field">
                <label [for]="'var-metrica-' + i">Métrica</label>
                <input [id]="'var-metrica-' + i" type="text" formControlName="metrica"
                  placeholder="Ex.: °C, m², unidades" />
              </div>
 
            </div>
          </div>
        </div>
 
        <button type="button" class="btn-add" (click)="adicionarVariavel()">
          + Adicionar variável
        </button>
 
      </fieldset>
 
      <p class="auth-error" *ngIf="error">{{ error }}</p>
 
      <div class="form-actions">
        <a routerLink="/estudos" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Salvando…' : 'Criar estudo' }}
        </button>
      </div>
 
    </form>
