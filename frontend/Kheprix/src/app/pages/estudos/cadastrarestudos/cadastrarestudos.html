<div class="page-container">

  <div class="page-header">
    <h1>N<span class="sc">ovo</span> E<span class="sc">studo</span></h1>
    <div class="divider">❧</div>
  </div>

  <!-- Nome -->
  <div class="form-group">
    <label class="field-label">Nome do estudo</label>
    <input class="field-input" type="text" [(ngModel)]="nome" placeholder="Placeholder" />
  </div>

  <!-- Variáveis -->
  <div class="section-header">
    <label class="field-label">Variáveis Estudadas</label>
    <button class="icon-btn primary add-var-btn" title="Adicionar variável" (click)="adicionarVariavel()">
      &#oplus; <span class="add-circle">+</span>
    </button>
  </div>

  <div class="variable-block" *ngFor="let v of variaveis; let i = index">
    <div class="var-grid">
      <div>
        <label class="field-label-sm">Nome</label>
        <input class="field-input" type="text" [(ngModel)]="v.nome" placeholder="Placeholder" />
      </div>
      <div>
        <label class="field-label-sm">Nível do Estudo</label>
        <select class="field-input" [(ngModel)]="v.nivel_aplicacao">
          <option *ngFor="let n of niveisAplicacao" [value]="n">{{ labelNivel(n) }}</option>
        </select>
      </div>
      <div>
        <label class="field-label-sm">Tipo de Dado</label>
        <select class="field-input" [(ngModel)]="v.tipo_dado">
          <option value="numerico">Numérico</option>
          <option value="tipado">Tipado</option>
          <option value="data">Data</option>
        </select>
      </div>
      <div>
        <label class="field-label-sm">Métrica</label>
        <input class="field-input" type="text" [(ngModel)]="v.metrica" placeholder="ex: °C" />
      </div>
      <div class="var-remove" *ngIf="variaveis.length > 1">
        <button class="icon-btn danger" (click)="removerVariavel(i)" title="Remover">&#10005;</button>
      </div>
    </div>
  </div>

  <!-- Observações -->
  <div class="form-group" style="margin-top:16px;">
    <label class="field-label">Observações</label>
    <textarea class="field-input" [(ngModel)]="observacoes" placeholder="Placeholder"></textarea>
  </div>

  <div class="error-msg" *ngIf="erro">{{ erro }}</div>

  <!-- Rodapé -->
  <div class="form-footer">
    <button class="btn-primary" (click)="confirmar()" [disabled]="carregando">
      {{ carregando ? 'Salvando...' : 'Confirmar' }}
    </button>
    <button class="back-btn" (click)="voltar()">&#9664;</button>
  </div>

</div>
