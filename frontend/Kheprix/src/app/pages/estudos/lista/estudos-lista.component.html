<div class="page-container">
  <h1 class="page-title">Estudos</h1>
  <div class="ornament-divider"><span>⸙</span></div>

  <div class="page-header-row">
    <button
      class="btn btn-primary"
      (click)="router.navigate(['/estudos/novo'])"
    >
      Adicionar Estudo
      <svg
        class="svg-icon"
        width="24"
        height="24"
        style="vertical-align: middle; overflow: hidden"
        fill="currentColor"
        viewBox="0 0 1024 1024"
        version="1.1"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M512 65.6c247.424 0 448 200.576 448 448S759.424 961.6 512 961.6 64 761.024 64 513.6 264.576 65.6 512 65.6z m0 48C291.0864 113.6 112 292.6864 112 513.6s179.0864 400 400 400 400-179.0864 400-400S732.9136 113.6 512 113.6z m0 209.6c13.2544 0 24 10.7456 24 24v144h144c13.2544 0 24 10.7456 24 24 0 13.2544-10.7456 24-24 24h-144.0016l0.0016 144c0 13.2544-10.7456 24-24 24-13.2544 0-24-10.7456-24-24l-0.0016-144H344c-13.2544 0-24-10.7456-24-24 0-13.2544 10.7456-24 24-24h144v-144c0-13.2544 10.7456-24 24-24z"
          fill="currentColor"
        />
      </svg>
    </button>
    <button class="back-btn" (click)="router.navigate(['/inicio'])">◀</button>
  </div>

  <div class="filter-bar">
    <span class="filter-label">Buscar por:</span>
    <select
      class="form-control"
      [(ngModel)]="tipoBusca"
      style="min-width: 180px"
    >
      <option value="nome">Nome do Estudo</option>
      <option value="criado_a_partir_de">Criado a partir de</option>
      <option value="criado_ate">Criado até</option>
      <option value="atualizado_a_partir_de">Atualizado a partir de</option>
      <option value="atualizado_ate">Atualizado até</option>
    </select>
    <input
      class="form-control"
      type="text"
      [(ngModel)]="termoBusca"
      placeholder="Digite sua busca..."
      style="flex: 1"
    />
    <button
      class="btn-icon"
      (click)="buscar()"
      title="Buscar"
      style="color: var(--color-bg-green-dark)"
    >
      <svg
        fill="currentColor"
        alt="Buscar"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        style="transform: scale(1)"
      >
        <path
          d="M16.32 14.9l5.39 5.4a1 1 0 0 1-1.42 1.4l-5.38-5.38a8 8 0 1 1 1.41-1.41zM10 16a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"
        ></path>
      </svg>
    </button>
    <button
      class="btn-icon"
      (click)="mostrarFiltros = !mostrarFiltros"
      title="Filtros avançados"
    >
      <svg
        fill="currentColor"
        alt="Filtros avançados"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 1235 1024"
        version="1.1"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M719.582609 1023.721739c-4.452174 0-8.904348-0.845913-13.356522-2.804869l-203.408696-86.728348a33.914435 33.914435 0 0 1-20.591304-31.332174V580.830609L9.182609 57.35513C0.278261 47.282087-2.226087 33.01287 3.33913 20.702609 8.904348 8.392348 20.869565 0.278261 34.226087 0.278261H1200.973913c13.356522 0 25.6 7.835826 30.886957 20.424348 5.565217 12.310261 3.06087 26.579478-5.843479 36.652521L753.530435 580.819478v408.765218a33.947826 33.947826 0 0 1-33.947826 34.137043zM549.843478 880.194783l135.791305 57.633391V567.674435c0-8.392348 3.06087-16.784696 8.904347-22.939826l429.913044-476.193392H111.026087l430.191304 476.193392c5.565217 6.15513 8.904348 14.547478 8.904348 22.939826V880.194783H549.843478z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>

  <div *ngIf="mostrarFiltros" class="form-row mb-lg">
    <div class="form-group">
      <label class="form-label">Criado a partir de</label>
      <input
        class="form-control"
        type="date"
        [(ngModel)]="filtros.criado_a_partir_de"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Criado até</label>
      <input
        class="form-control"
        type="date"
        [(ngModel)]="filtros.criado_ate"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Atualizado a partir de</label>
      <input
        class="form-control"
        type="date"
        [(ngModel)]="filtros.atualizado_a_partir_de"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Atualizado até</label>
      <input
        class="form-control"
        type="date"
        [(ngModel)]="filtros.atualizado_ate"
      />
    </div>
  </div>

  <div *ngIf="loading" class="loading-overlay"><div class="spinner"></div></div>

  <table class="data-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Data de Criação</th>
        <th>Última Alteração</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of estudos" (click)="verDetalhe(e)">
        <td>{{ e.nome }}</td>
        <td>{{ util.formatDate(e.created_at) }}</td>
        <td>{{ util.formatDate(e.updated_at) }}</td>
        <td (click)="$event.stopPropagation()">
          <div class="actions-cell">
            <ng-container *ngIf="isProprietario(e)">
              <button
                class="btn-icon"
                (click)="verColaboradores(e)"
                title="Colaboradores"
              >
                <span style="font-size: 1.2rem"
                  ><svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M20 18L17 18M17 18L14 18M17 18V15M17 18V21M11 21H4C4 17.134 7.13401 14 11 14C11.695 14 12.3663 14.1013 13 14.2899M15 7C15 9.20914 13.2091 11 11 11C8.79086 11 7 9.20914 7 7C7 4.79086 8.79086 3 11 3C13.2091 3 15 4.79086 15 7Z"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    /></svg
                ></span>
              </button>
              <button
                class="btn-icon danger"
                (click)="deletar(e)"
                title="Excluir"
              >
                <span style="font-size: 1.2rem; color: var(--color-delete)"

                    xmlns:xlink="http://www.w3.org/1999/xlink"
                    version="1.1"
                    width="24"
                    height="24"
                    viewBox="0 0 256 256"
                    xml:space="preserve"
                  >

                      style="
                        stroke: none;
                        stroke-width: 0;
                        stroke-dasharray: none;
                        stroke-linecap: butt;
                        stroke-linejoin: miter;
                        stroke-miterlimit: 10;
                        fill: none;
                        fill-rule: nonzero;
                        opacity: 1;
                      "
                      transform="translate(1.4065934065934016 1.4065934065934016) scale(2.81 2.81)"
                    >
                      <path
                        d="M 64.71 90 H 25.291 c -4.693 0 -8.584 -3.67 -8.859 -8.355 l -3.928 -67.088 c -0.048 -0.825 0.246 -1.633 0.812 -2.234 c 0.567 -0.601 1.356 -0.941 2.183 -0.941 h 59.002 c 0.826 0 1.615 0.341 2.183 0.941 c 0.566 0.601 0.86 1.409 0.813 2.234 l -3.928 67.089 C 73.294 86.33 69.403 90 64.71 90 z M 18.679 17.381 l 3.743 63.913 C 22.51 82.812 23.771 84 25.291 84 H 64.71 c 1.52 0 2.779 -1.188 2.868 -2.705 l 3.742 -63.914 H 18.679 z"

                          stroke-linejoin: miter;
                          stroke-miterlimit: 10;
                          fill: currentColor;
                          fill-rule: nonzero;
                          opacity: 1;
                        "
                        transform=" matrix(1 0 0 1 0 0) "
                        stroke-linecap="round"
                      />
                      <path
                        d="M 80.696 17.381 H 9.304 c -1.657 0 -3 -1.343 -3 -3 s 1.343 -3 3 -3 h 71.393 c 1.657 0 3 1.343 3 3 S 82.354 17.381 80.696 17.381 z"
                        style="

                        style="
                          stroke: none;
                          stroke-width: 1;
                          stroke-dasharray: none;
                          stroke-linecap: butt;
                          stroke-linejoin: miter;
                          stroke-miterlimit: 10;
                          fill: currentColor;
                          fill-rule: nonzero;
                          opacity: 1;
                        "
                        transform=" matrix(1 0 0 1 0 0) "
                        stroke-linecap="round"
                      />
                      <path
                        d="M 58.33 74.991 c -0.06 0 -0.118 -0.002 -0.179 -0.005 c -1.653 -0.097 -2.916 -1.517 -2.819 -3.171 l 2.474 -42.244 c 0.097 -1.655 1.508 -2.933 3.171 -2.819 c 1.653 0.097 2.916 1.516 2.819 3.17 l -2.474 42.245 C 61.229 73.761 59.906 74.991 58.33 74.991 z"
                        style="
                          stroke: none;
                          stroke-width: 1;
                          stroke-dasharray: none;
                          stroke-linecap: butt;
                          stroke-linejoin: miter;
                          stroke-miterlimit: 10;
                          fill: currentColor;
                          fill-rule: nonzero;
                          opacity: 1;
                        "
                        transform=" matrix(1 0 0 1 0 0) "
                        stroke-linecap="round"
                      />
                      <path
                        d="M 31.669 74.991 c -1.577 0 -2.898 -1.23 -2.992 -2.824 l -2.473 -42.245 c -0.097 -1.654 1.165 -3.073 2.819 -3.17 c 1.646 -0.111 3.073 1.165 3.17 2.819 l 2.473 42.244 c 0.097 1.654 -1.165 3.074 -2.819 3.171 C 31.788 74.989 31.729 74.991 31.669 74.991 z"
                        style="

                          stroke-width: 1;

                          stroke-linecap: butt;
                          stroke-linejoin: miter;
                          stroke-miterlimit: 10;
                          fill: currentColor;
                          fill-rule: nonzero;
                          opacity: 1;
                        "
                        transform=" matrix(1 0 0 1 0 0) "
                        stroke-linecap="round"
                      />
                      <path
                        d="M 45 74.991 c -1.657 0 -3 -1.343 -3 -3 V 29.747 c 0 -1.657 1.343 -3 3 -3 c 1.657 0 3 1.343 3 3 v 42.244 C 48 73.648 46.657 74.991 45 74.991 z"
                        style="
                          stroke: none;
                          stroke-width: 1;
                          stroke-dasharray: none;
                          stroke-linecap: butt;
                          stroke-linejoin: miter;
                          stroke-miterlimit: 10;
                          fill: currentColor;
                          fill-rule: nonzero;
                          opacity: 1;
                        "
                        transform=" matrix(1 0 0 1 0 0) "
                        stroke-linecap="round"
                      />
                    </g></svg
                ></span>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <div
    *ngIf="!loading && estudos.length === 0"
    class="text-center text-muted mt-lg"
  >
    Nenhum estudo encontrado.
  </div>
</div>
