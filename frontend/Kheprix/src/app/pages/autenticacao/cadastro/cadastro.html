<div class="auth-page">

  <div class="auth-form-col">
    <div class="form-group">
      <label class="field-label">Nome:</label>
      <input class="field-input" type="text" [(ngModel)]="nome" />
    </div>
    <div class="form-group">
      <label class="field-label">E-mail:</label>
      <input class="field-input" type="email" [(ngModel)]="email" />
    </div>
    <div class="form-group">
      <label class="field-label">Senha:</label>
      <input class="field-input" type="password" [(ngModel)]="senha" />
    </div>
    <div class="form-group">
      <label class="field-label">Confirme a senha:</label>
      <input class="field-input" type="password" [(ngModel)]="confirmarSenha" />
    </div>
    <div class="error-msg" *ngIf="erro">{{ erro }}</div>
    <button class="btn-primary btn-confirmar" (click)="confirmar()" [disabled]="carregando">
      {{ carregando ? 'Aguarde...' : 'Confirmar' }}
    </button>
  </div>

  <div class="auth-deco-col">
    <h2 class="auth-title">C A D A S T R E - S E</h2>
    <div class="deco-beetle">[ imagem besouro aqui ]</div>
    <div class="deco-lines">
      <span class="deco-line"></span>
      <span class="deco-line"></span>
    </div>
    <p class="auth-subtitle">Faça seu cadastro gratuitamente para ter acesso ao sistema</p>
    <p class="auth-subtitle">
      Já tem um cadastro?
      <a class="link" (click)="irParaLogin()">Faça seu login aqui</a>
    </p>
  </div>

</div>
