<div class="auth-page">

  <!-- Coluna esquerda: formulário -->
  <div class="auth-form-col">
    <div class="form-group">
      <label class="field-label">E-mail:</label>
      <input class="field-input" type="email" [(ngModel)]="email" placeholder="" />
    </div>

    <div class="form-group">
      <label class="field-label">Senha:</label>
      <input class="field-input" type="password" [(ngModel)]="senha" placeholder="" />
    </div>

    <div class="form-group forgot">
      <a class="link" (click)="irParaRecuperacao()">Esqueci minha senha</a>
    </div>

    <div class="error-msg" *ngIf="erro">{{ erro }}</div>

    <button class="btn-primary btn-confirmar" (click)="confirmar()" [disabled]="carregando">
      {{ carregando ? 'Aguarde...' : 'Confirmar' }}
    </button>
  </div>

  <!-- Coluna direita: decoração -->
  <div class="auth-deco-col">
    <h2 class="auth-title">L O G I N</h2>

    <div class="deco-beetle">[ imagem besouro aqui ]</div>

    <div class="deco-lines">
      <span class="deco-line"></span>
      <span class="deco-line"></span>
    </div>

    <p class="auth-subtitle">Faça seu login de usuário para ter acesso ao sistema</p>
    <p class="auth-subtitle">
      Ainda não tem uma conta?
      <a class="link" (click)="irParaCadastro()">Faça seu cadastro aqui</a>
    </p>
  </div>

</div>
