<div class="page-container">

  <div class="page-header">
    <h1>N<span class="sc">ova</span> U<span class="sc">nidade</span> A<span class="sc">mostral</span></h1>
    <div class="divider">❧</div>
  </div>

  <!-- Nome -->
  <div class="form-group">
    <label class="field-label">Nome</label>
    <input class="field-input" type="text" [(ngModel)]="nome" placeholder="Identificador da unidade" />
  </div>

  <!-- Latitude / Longitude / GPS -->
  <div class="coord-row">
    <div class="coord-field">
      <label class="field-label">Latitude</label>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="latitudeStr"
        placeholder="-25°42'48&quot;"
      />
    </div>
    <div class="coord-field">
      <label class="field-label">Longitude</label>
      <input
        class="field-input"
        type="text"
        [(ngModel)]="longitudeStr"
        placeholder="-49°16'15&quot;"
      />
    </div>
    <button
      class="gps-btn"
      title="Usar localização do dispositivo"
      (click)="obterLocalizacao()"
      [class.spinning]="gpsCarregando"
    >
      &#9906;
    </button>
  </div>

  <!-- Raio -->
  <div class="form-group" style="max-width: 340px;">
    <label class="field-label">Raio (em metros)</label>
    <div class="raio-row">
      <input class="field-input" type="number" [(ngModel)]="raio" placeholder="2500" />
      <span class="raio-hint">Usado para indicar a área total do estudo</span>
    </div>
  </div>

  <!-- Método de Coleta / Esforço -->
  <div class="grid-2">
    <div>
      <label class="field-label">Método de Coleta</label>
      <input class="field-input" [(ngModel)]="metodoColeta" placeholder="Armadilhas" />
    </div>
    <div>
      <label class="field-label">Esforço Amostral</label>
      <input class="field-input" [(ngModel)]="esforcoAmostral" placeholder="15" />
    </div>
  </div>

  <!-- Variáveis da Unidade -->
  <div *ngIf="variaveis.length > 0" style="margin-top: 24px;">
    <label class="field-label">Variáveis da Unidade</label>
    <div class="var-item" *ngFor="let v of variaveis">
      <label class="field-label-sm">{{ v.variavel.nome }}</label>
      <div class="var-input-row">
        <input class="field-input var-input" [(ngModel)]="v.valor" placeholder="Placeholder" />
        <span class="var-metrica">{{ v.variavel.metrica || '' }}</span>
      </div>
    </div>
  </div>

  <div class="error-msg" *ngIf="erro">{{ erro }}</div>

  <div class="form-footer">
    <button class="btn-primary" (click)="confirmar()" [disabled]="carregando">
      {{ carregando ? 'Salvando...' : 'Confirmar' }}
    </button>
    <button class="back-btn" (click)="voltar()">&#9664;</button>
  </div>

</div>
