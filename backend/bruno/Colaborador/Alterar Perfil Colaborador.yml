info:
  name: Alterar Perfil Colaborador
  type: http
  seq: 2

http:
  method: patch
  url: http://localhost:3000/estudos/:estudo_id/colaboradores/:colaborador_id
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
    - name: colaborador_id
      value: "2"
      type: path
  body:
    type: json
    data: |-
      {
        "perfil": "visualizador"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
