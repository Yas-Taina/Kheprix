info:
  name: Validar Token
  type: http
  seq: 6

http:
  method: post
  url: http://localhost:3000/autenticacao/validar_token
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{token}}"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
