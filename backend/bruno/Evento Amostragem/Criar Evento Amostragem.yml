info:
  name: Criar Evento de Amostragem
  type: http
  seq: 2

http:
  method: post
  url: http://localhost:3000/estudos/:estudo_id/campanhas/:campanha_id/unidades_amostrais/:unidade_amostral_id/eventos_amostragem
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "13"
      type: path
    - name: campanha_id
      value: "18"
      type: path
    - name: unidade_amostral_id
      value: "24"
      type: path
  body:
    type: json
    data: |-
      {
        "horario_inicio": "2026-03-10T08:00:00.000Z",
        "esforco_real": "4 horas de observação direta",
      "valores_variaveis": [
        { "variavel_id": 1, "valor": "25.3" }
      ]
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
