info:
  name: Editar Especie
  type: http
  seq: 4

http:
  method: patch
  url: http://localhost:3000/estudos/:estudo_id/especies/:especie_id
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "6"
      type: path
    - name: especie_id
      value: "18"
      type: path
  body:
    type: json
    data: |
      {
        "classe": "Mammalia",
        "ordem": "Carnivora",
        "familia": "Felidae",
        "genero": "Panthera",
        "especie": "Panthera onca",
        "nome_popular": "Onça-pintada",
        "status_conservacao": "Vulnerável",
        "endemismo": false,
        "foto": "https://exemplo.com/foto.jpg"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
