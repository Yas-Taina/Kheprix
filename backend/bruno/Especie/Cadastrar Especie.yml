info:
  name: Cadastrar Especie
  type: http
  seq: 3

http:
  method: post
  url: http://localhost:3000/estudos/:estudo_id/especies
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "nome_cientifico": "Panthera onca",
        "nome_popular": "Onça-pintada",
        "classe": "Mammalia",
        "genero": "Panthera",
        "status_conservacao": "Vulnerável",
        "nativa_da_regiao": true
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
