info:
  name: Cadastrar Especie
  type: http
  seq: 3

http:
  method: post
  url: http://localhost:3000/estudos/:estudo_id/especies
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "6"
      type: path
  body:
    type: json
    data: |-
      {
        "classe": "Insecta",
        "ordem": "Hymenoptera",
        "familia": "Formicidae",
        "genero": "Atta",
        "especie": "laevigata",
        "nome_popular": "Formiga-cortadeira",
        "status_conservacao": "Pouco preocupante",
        "endemismo": true,
        "foto": "data:image/jpeg;base64,"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
