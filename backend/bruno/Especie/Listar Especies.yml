info:
  name: Listar Especies
  type: http
  seq: 1

http:
  method: get
  url: http://localhost:3000/estudos/:estudo_id/especies
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
    - name: nome_popular
      value: ""
      type: query
      enabled: false
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
