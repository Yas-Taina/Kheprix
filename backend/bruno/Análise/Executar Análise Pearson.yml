info:
  name: Executar Análise Pearson
  type: http
  seq: 2

http:
  method: post
  url: http://localhost:3000/estudos/:estudo_id/analises/executar
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
  body:
    type: json
    data: |
      {
        "chave": "pearson",
        "variavel_x_id": 1,
        "variavel_y_id": 2
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
