info:
  name: Executar Pearson Variável x Abundância
  type: http
  seq: 7

http:
  method: post
  url: http://localhost:3000/estudos/:estudo_id/analises/executar
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
  body:
    type: json
    data: |
      {
        "chave": "pearson",
        "variavel_x_id": 1,
        "fonte_y": "abundancia",
        "nivel_agregacao": "unidade_amostral"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
