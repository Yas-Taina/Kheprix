info:
  name: Cadastrar Estudo
  type: http
  seq: 1

http:
  method: post
  url: http://localhost:3000/estudos
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nome": "Estudo Teste 1",
        "observacoes": "Observações do estudo",
        "variaveis": [
          {"nome": "Responsavel", "nivel_aplicacao": "campanha", "tipo_dado": "string"},
          {"nome": "Tipo Solo", "nivel_aplicacao": "unidade", "tipo_dado": "string"},
          {"nome": "Temperatura", "metrica": "graus C", "nivel_aplicacao": "evento", "tipo_dado": "number"},
          {"nome": "Comportamento", "nivel_aplicacao": "registro", "tipo_dado": "boolean"}
        ]
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
