info:
  name: Alterar Senha Codigo
  type: http
  seq: 3

http:
  method: patch
  url: http://localhost:3000/estudos/:estudo_id/codigo_acesso
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "senha_autocadastro": "NovaSenha456"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
