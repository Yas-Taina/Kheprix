info:
  name: Listar Unidades Amostrais
  type: http
  seq: 1

http:
  method: get
  url: http://localhost:3000/estudos/:estudo_id/campanhas/:campanha_id/unidades_amostrais
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "6"
      type: path
    - name: campanha_id
      value: "6"
      type: path
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
