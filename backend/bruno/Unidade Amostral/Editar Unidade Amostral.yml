info:
  name: Editar Unidade Amostral
  type: http
  seq: 4

http:
  method: patch
  url: http://localhost:3000/estudos/:estudo_id/campanhas/:campanha_id/unidades_amostrais/:id
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: estudo_id
      value: "1"
      type: path
    - name: campanha_id
      value: "1"
      type: path
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "latitude": "-23.55100",
        "longitude": "-46.63400",
        "raio": 75.0,
        "metodo_coleta": "Armadilha fotográfica e auditiva",
        "esforco_amostral": "45 dias de exposição"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
