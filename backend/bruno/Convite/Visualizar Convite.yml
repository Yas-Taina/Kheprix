info:
  name: Visualizar Convite
  type: http
  seq: 5

http:
  method: get
  url: http://localhost:3000/convites/:token
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: token
      value: "<token_do_convite>"
      type: path
  auth: none

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
