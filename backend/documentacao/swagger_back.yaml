openapi: 3.0.3
info:
  title: API Backend
  version: "1.0"
  description: >
    Documentação completa dos endpoints do backend.
    Endpoints marcados com `BearerAuth` exigem header `Authorization: Bearer <token>`.

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT obtido via POST /autenticacao/login. Expira em 24h."

  schemas:
    ErroSimples:
      type: object
      properties:
        erro:
          type: string

    ErrosArray:
      type: object
      properties:
        erros:
          type: array
          items:
            type: string

    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time

    Token:
      type: object
      properties:
        token:
          type: string

    Mensagem:
      type: object
      properties:
        mensagem:
          type: string

    ValorVariavel:
      type: object
      properties:
        id:
          type: integer
        variavel_id:
          type: integer
        valor:
          type: string

    ValorVariavelInput:
      type: object
      required: [variavel_id, valor]
      properties:
        variavel_id:
          type: integer
        valor:
          type: string

    ValorVariavelSincronizarInput:
      type: object
      required: [valor]
      properties:
        id:
          type: integer
          description: "Presente para atualizar existente; ausente para criar novo"
        variavel_id:
          type: integer
          description: "Obrigatório somente ao criar (sem id)"
        valor:
          type: string

    Campanha:
      type: object
      properties:
        id:
          type: integer
        estudo_id:
          type: integer
        nome:
          type: string
        data_inicio:
          type: string
          format: date
        descricao:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        valores_variaveis:
          type: array
          items:
            $ref: '#/components/schemas/ValorVariavel'

    UnidadeAmostral:
      type: object
      properties:
        id:
          type: integer
        campanha_id:
          type: integer
        nome:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        raio:
          type: number
          format: double
          nullable: true
        metodo_coleta:
          type: string
          nullable: true
        esforco_amostral:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        valores_variaveis:
          type: array
          items:
            $ref: '#/components/schemas/ValorVariavel'

    EventoAmostragem:
      type: object
      properties:
        id:
          type: integer
        unidade_amostral_id:
          type: integer
        horario_inicio:
          type: string
          format: date-time
        esforco_real:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        valores_variaveis:
          type: array
          items:
            $ref: '#/components/schemas/ValorVariavel'

    RegistroOcorrencia:
      type: object
      properties:
        id:
          type: integer
        evento_amostragem_id:
          type: integer
        especie_id:
          type: integer
        data:
          type: string
          format: date
        hora:
          type: string
          example: "14:30:00"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        qtde_individuos:
          type: integer
          nullable: true
        ausencia_especie:
          type: boolean
        foto:
          type: string
          nullable: true
          description: "URL absoluta da foto ou null"
        created_at:
          type: string
          format: date-time
        valores_variaveis:
          type: array
          items:
            $ref: '#/components/schemas/ValorVariavel'

    Especie:
      type: object
      properties:
        id:
          type: integer
        estudo_id:
          type: integer
        classe:
          type: string
        ordem:
          type: string
        familia:
          type: string
        genero:
          type: string
        especie:
          type: string
        nome_popular:
          type: string
          nullable: true
        status_conservacao:
          type: string
          nullable: true
        endemismo:
          type: boolean
        foto:
          type: string
          nullable: true
          description: "URL absoluta da foto ou null"
        created_at:
          type: string
          format: date-time

    Variavel:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        metrica:
          type: string
          nullable: true
        nivel_aplicacao:
          type: string
          enum: [campanha, unidade, evento, registro]
        tipo_dado:
          type: string
          enum: [string, number, date, boolean]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Colaborador:
      type: object
      properties:
        id_usuario:
          type: integer
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
          enum: [colaborador, proprietario]

    Convite:
      type: object
      properties:
        id:
          type: integer
        email_convidado:
          type: string
        status:
          type: string
          enum: [pendente, aceito, recusado, expirado]
        data_expiracao:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ConviteRecebido:
      type: object
      properties:
        id:
          type: integer
        estudo_id:
          type: integer
        nome_estudo:
          type: string
        nome_remetente:
          type: string
        token:
          type: string
        status:
          type: string
          enum: [pendente, aceito, recusado, expirado]
        data_expiracao:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ConvitePublico:
      type: object
      properties:
        id:
          type: integer
        estudo_id:
          type: integer
        nome_estudo:
          type: string
        email_convidado:
          type: string
        status:
          type: string
          enum: [pendente, aceito, recusado, expirado]
        data_expiracao:
          type: string
          format: date-time
          nullable: true

    CodigoAcesso:
      type: object
      properties:
        codigo:
          type: string
        senha_autocadastro:
          type: string
          nullable: true

    ResultadoAnalise:
      type: object
      properties:
        analise:
          type: string
          description: "Chave da análise executada"
        nome:
          type: string
          description: "Nome legível da análise"
        valor:
          type: object
          nullable: true
          description: "JSON retornado pela API R (estrutura variável por análise)"
        grafico:
          type: string
          nullable: true
          description: "HTML do gráfico retornado pela API R"
        urlArquivo:
          type: string
          nullable: true
          description: "URL absoluta do arquivo .zip com resultado.json, resultado.xml e resultado.html"

    DashboardGlobal:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        updated_at:
          type: string
          format: date-time
        data_inicio:
          type: string
          format: date
          nullable: true
        total_registros:
          type: integer
        total_especies:
          type: integer
        especies_ameacadas:
          type: integer
        especies_nativas:
          type: integer
        especies_invasoras:
          type: integer
        total_individuos:
          type: integer

paths:

  /autenticacao/login:
    post:
      tags: [Autenticação]
      summary: Login com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
      responses:
        '200':
          description: Token JWT gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
              example:
                erro: "Email ou senha inválidos"
        '422':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /autenticacao/solicitar_redefinicao:
    post:
      tags: [Autenticação]
      summary: Solicitar e-mail de redefinição de senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: "Resposta sempre igual por segurança, independente de o email existir"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: "Se o email existir, enviaremos instruções para redefinição de senha"
        '422':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /autenticacao/validar_token_redefinicao:
    post:
      tags: [Autenticação]
      summary: Validar token de redefinição de senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:
                    type: boolean
                    example: true
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
              example:
                erro: "Token inválido ou expirado"
        '422':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /autenticacao/redefinir_senha:
    post:
      tags: [Autenticação]
      summary: Redefinir senha usando token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, nova_senha]
              properties:
                token:
                  type: string
                nova_senha:
                  type: string
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: "Senha redefinida com sucesso"
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '422':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /autenticacao/validar_token:
    post:
      tags: [Autenticação]
      summary: Verificar se um token JWT ainda é válido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Resultado da validação
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:
                    type: boolean
        '422':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /usuarios/autocadastro:
    post:
      tags: [Usuários]
      summary: Cadastro de novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                email:
                  type: string
                  format: email
                senha:
                  type: string
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '422':
          description: Validação falhou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Resumo do último estudo acessado pelo usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Resumo do estudo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardGlobal'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '404':
          description: Nenhum estudo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
              example:
                erro: "Nenhum estudo encontrado"

  /estudos:
    get:
      tags: [Estudos]
      summary: Listar estudos do usuário autenticado
      security:
        - BearerAuth: []
      parameters:
        - name: nome
          in: query
          schema:
            type: string
        - name: criado_a_partir_de
          in: query
          schema:
            type: string
            format: date
        - name: criado_ate
          in: query
          schema:
            type: string
            format: date
        - name: atualizado_a_partir_de
          in: query
          schema:
            type: string
            format: date
        - name: atualizado_ate
          in: query
          schema:
            type: string
            format: date
      responses:
        '501':
          description: Lista de estudos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nome:
                      type: string
                    observacoes:
                      type: string
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                    perfil:
                      type: string
                      enum: [colaborador, proprietario]
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '422':
          description: Filtros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

    post:
      tags: [Estudos]
      summary: Criar novo estudo com variáveis
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, variaveis]
              properties:
                nome:
                  type: string
                observacoes:
                  type: string
                  nullable: true
                variaveis:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [nome, nivel_aplicacao, tipo_dado]
                    properties:
                      nome:
                        type: string
                      nivel_aplicacao:
                        type: string
                        enum: [campanha, unidade, evento, registro]
                      tipo_dado:
                        type: string
                        enum: [string, number, date, boolean]
                      metrica:
                        type: string
                        nullable: true
      responses:
        '201':
          description: Estudo criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nome:
                    type: string
                  observacoes:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '422':
          description: Validação falhou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrosArray'

  /estudos/ingressar:
    post:
      tags: [Estudos]
      summary: Ingressar em estudo via código de acesso
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, senha_autocadastro]
              properties:
                codigo:
                  type: string
                senha_autocadastro:
                  type: string
      responses:
        '201':
          description: Ingresso realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  estudo_id:
                    type: integer
                  nome_estudo:
                    type: string
                  perfil:
                    type: string
                    example: colaborador
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '422':
          description: Código inválido / senha incorreta / já colaborador
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErroSimples'
                  - $ref: '#/components/schemas/ErrosArray'

  /estudos/{id}:
    delete:
      tags: [Estudos]
      summary: Sair ou excluir estudo
      description: >
        Proprietário único → exclui o estudo (soft delete em cascata). 
        Co-proprietário ou colaborador → remove apenas sua participação.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Estudo excluído (proprietário único)
        '200':
          description: Usuário removido do estudo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: "Você foi descadastrado do estudo"
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '404':
          description: Estudo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'

  /estudos/{estudo_id}/dashboard:
    get:
      tags: [Estudos]
      summary: Dashboard analítico de um estudo específico
      security:
        - BearerAuth: []
      parameters:
        - name: estudo_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  estudo:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
                  resumo:
                    type: object
                    properties:
                      total_registros: { type: integer }
                      total_especies: { type: integer }
                      especies_ameacadas: { type: integer }
                      especies_nativas: { type: integer }
                      especies_invasoras: { type: integer }
                      total_individuos: { type: integer }
                      data_inicio: { type: string, format: date, nullable: true }
                  registros_por_data:
                    type: array
                    items:
                      type: object
                      properties:
                        data: { type: string, format: date }
                        total: { type: integer }
                  ocorrencias_por_especie:
                    type: array
                    items:
                      type: object
                      properties:
                        nome_cientifico: { type: string }
                        nome_popular: { type: string, nullable: true }
                        total: { type: integer }
                  pontos_mapa:
                    type: array
                    items:
                      type: object
                      properties:
                        latitude: { type: number }
                        longitude: { type: number }
                        nome_cientifico: { type: string }
                        quantidade: { type: integer }
                  registros_por_especie_tempo:
                    type: array
                    items:
                      type: object
                      properties:
                        ano: { type: integer }
                        mes: { type: integer }
                        nome_cientifico: { type: string }
                        is_endemica: { type: boolean }
                        total: { type: integer }
                  especies_distintas_por_mes:
                    type: array
                    items:
                      type: object
                      properties:
                        ano: { type: integer }
                        mes: { type: integer }
                        total: { type: integer }
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '403':
          description: Sem acesso ao estudo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '404':
          description: Estudo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'

  /estudos/{estudo_id}/exportar_dados:
    get:
      tags: [Estudos]
      summary: Exportar dados do estudo em CSV ou XML
      security:
        - BearerAuth: []
      parameters:
        - name: estudo_id
          in: path
          required: true
          schema:
            type: integer
        - name: formato
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xml]
        - name: agrupamento
          in: query
          required: false
          description: "Obrigatório quando formato=csv"
          schema:
            type: string
            enum: [registro_ocorrencia, evento_amostragem, unidade_amostral, campanha, especie]
      responses:
        '200':
          description: Arquivo para download
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
                format: binary
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '403':
          description: Sem acesso ao estudo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroSimples'
        '422':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrosArray'
                  - $ref: '#/components/schemas/ErroSimples'

  /estudos/{estudo_id}/analises/executar:
    post:
      tags: [Análises]
      summary: Executar análise estatística
      security:
        - BearerAuth: []
      parameters:
        - name: estudo_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chave]
              properties:
                chave:
                  type: string
                  description: >
                    Chave da análise. Valores válidos: lognormal, logserie, geometrica, vara_quebrada,
                    rarefacao, jackknife1, jackknife2, chao1, chao2, bootstrap, ace, ice,
                    shannon, simpson, margalef, pielou, berger_parker, brillouin, macintosh, hurlbert, mcnaughton,
