  /analise/rda:
    post:
      tags: [multivariada]
      summary: RDA — Análise de Redundância (gráfico HTML)
      description: |
        Realiza a Análise de Redundância (RDA) relacionando a composição de espécies
        às variáveis ambientais. Retorna biplot interativo com amostras (azul),
        espécies (vermelho) e vetores das variáveis ambientais (verde).

        **Restrição importante:** o número de amostras deve ser maior que o número
        de variáveis ambientais para evitar overfitting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbundanciasComVariaveisAmbientais'
      responses:
        '200':
          description: Biplot HTML interativo da RDA
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro (ex. overfitting — mais variáveis do que amostras)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/cca:
    post:
      tags: [multivariada]
      summary: CCA — Análise de Correspondência Canônica (gráfico HTML)
      description: |
        Realiza a Análise de Correspondência Canônica (CCA), adequada para dados de
        contagem com gradiente longo de espécies. Retorna biplot interativo com
        amostras (roxo), espécies (laranja) e vetores ambientais (verde-azulado).

        **Restrição:** número de amostras deve ser maior que o número de variáveis ambientais.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbundanciasComVariaveisAmbientais'
      responses:
        '200':
          description: Biplot HTML interativo da CCA
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/nmds:
    post:
      tags: [multivariada]
      summary: nMDS — Escalonamento Multidimensional Não-Métrico (gráfico HTML)
      description: |
        Ordena amostras em espaço bidimensional preservando as distâncias de Bray-Curtis
        (via `metaMDS`, k=2, máx. 100 tentativas). Exibe stress e qualidade do ajuste.

        - Stress < 0.05 → Excelente
        - Stress < 0.10 → Bom
        - Stress < 0.20 → Utilizável
        - Stress ≥ 0.20 → Pobre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbundanciasPorAmostra'
      responses:
        '200':
          description: Gráfico nMDS HTML interativo
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/pca:
    post:
      tags: [multivariada]
      summary: PCA — Análise de Componentes Principais (gráfico HTML)
      description: |
        Realiza PCA nos dados de abundância (escalonados e centrados).
        Retorna biplot interativo com amostras e espécies no espaço das
        duas primeiras componentes principais, exibindo a variância explicada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbundanciasPorAmostra'
      responses:
        '200':
          description: Biplot PCA HTML interativo
          content:
