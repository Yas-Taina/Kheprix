      tags: [correlacao]
      summary: Correlação de Pearson (JSON)
      description: |
        Calcula a correlação paramétrica de Pearson entre dois vetores numéricos.
        Inclui intervalo de confiança de 95% e classificação da força da correlação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
      responses:
        '200':
          description: Resultado da correlação de Pearson
          content:
            application/json:
              schema:
                type: object
                properties:
                  correlacao:
                    type: number
                    description: Coeficiente r de Pearson (-1 a 1).
                  p_valor:
                    type: number
                  significativo:
                    type: boolean
                  intervalo_confianca:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                  interpretacao:
                    type: string
                    example: "Correlação forte"
                  direcao:
                    type: string
                    enum: [Positiva, Negativa]
                  nome_x:
                    type: string
                  nome_y:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

