      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisGrupos'
      responses:
        '200':
          description: Resultado do Teste T
          content:
            application/json:
              schema:
                type: object
                properties:
                  estatistica_t:
                    type: number
                  p_valor:
                    type: number
                  significativo:
                    type: boolean
                  intervalo_confianca:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                    description: IC 95% para a diferença entre as médias.
                  media_grupo1:
                    type: number
                  media_grupo2:
                    type: number
                  diferenca_medias:
                    type: number
                  nome_grupo1:
                    type: string
                  nome_grupo2:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/shapiro:
    post:
      tags: [testes-estatisticos]
      summary: Teste de Shapiro-Wilk (normalidade)
      description: |
        Testa se os dados seguem distribuição normal. Funciona com 3 a 5000 observações.
        **Atenção:** amostras grandes tendem a rejeitar normalidade mesmo com desvios pequenos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VetorSimples'
      responses:
        '200':
          description: Resultado do Teste de Shapiro-Wilk
          content:
            application/json:
              schema:
                type: object
                properties:
                  estatistica_w:
                    type: number
                    description: Estatística W (próxima de 1 = mais normal).
                  p_valor:
                    type: number
                  normal:
                    type: boolean
                    description: true se p > 0.05 (não rejeita normalidade).
                  interpretacao:
                    type: string
                  nome_variavel:
                    type: string
                  nota:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/kruskal:
    post:
      tags: [testes-estatisticos]
      summary: Teste de Kruskal-Wallis
      description: |
        Alternativa não paramétrica à ANOVA de um fator. Compara as medianas
        de três ou mais grupos independentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiplosGrupos'
      responses:
        '200':
          description: Resultado do Teste de Kruskal-Wallis
          content:
            application/json:
              schema:
                type: object
                properties:
                  estatistica_h:
                    type: number
                  p_valor:
                    type: number
                  significativo:
                    type: boolean
                  gl:
                    type: integer
                    description: Graus de liberdade (número de grupos − 1).
                  medianas_por_grupo:
                    type: object
                    additionalProperties:
                      type: number
                    description: Mediana de cada grupo (chave = nome do grupo).
                  nome_variavel:
                    type: string
                  interpretacao:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/anova:
    post:
      tags: [testes-estatisticos]
      summary: ANOVA de um fator
      description: |
        Análise de Variância paramétrica de um fator. Compara as médias de
        três ou mais grupos. Pressupõe normalidade e homogeneidade de variâncias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiplosGrupos'
      responses:
        '200':
          description: Resultado da ANOVA
          content:
            application/json:
              schema:
                type: object
                properties:
                  f_valor:
                    type: number
                  p_valor:
                    type: number
                  significativo:
                    type: boolean
                  gl_tratamento:
                    type: integer
                  gl_residuo:
                    type: integer
                  medias_por_grupo:
                    type: object
                    additionalProperties:
                      type: number
                    description: Média de cada grupo (chave = nome do grupo).
                  nome_variavel:
                    type: string
                  interpretacao:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/ks:
    post:
      tags: [testes-estatisticos]
      summary: Teste de Kolmogorov-Smirnov
      description: |
        Dois modos de uso:

        **Modo 1 — Duas amostras** (padrão): compara se `amostra1` e `amostra2`
        vêm da mesma distribuição. Envie ambos os campos.

        **Modo 2 — Uma amostra vs distribuição teórica**: envie apenas `amostra`
        e `distribuicao` (ex. `"pnorm"`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KSTeste'
      responses:
        '200':
          description: Resultado do Teste KS
          content:
            application/json:
              schema:
                type: object
                properties:
                  estatistica_d:
                    type: number
                    description: Estatística D (distância máxima entre CDFs).
                  p_valor:
                    type: number
                  significativo:
                    type: boolean
                  interpretacao:
                    type: string
                  nome_amostra1:
                    type: string
                  nome_amostra2:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_gaussiano:
    post:
      tags: [glm]
      summary: GLM Gaussiano (Normal) — JSON
      description: |
        Ajusta um GLM com família Gaussiana (equivalente à regressão linear clássica).
        Apropriado para variáveis resposta contínuas com distribuição normal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
            example:
              y: [5, 12, 8, 15, 3, 18, 7, 20]
              x: [10, 15, 12, 18, 8, 22, 11, 25]
              nome_y: "Numero_de_Especies"
              nome_x: "Area_ha"
      responses:
        '200':
          description: Resultado do modelo Gaussiano
          content:
            application/json:
              schema:
                type: object
                properties:
                  aic:
                    type: number
                  deviance:
                    type: number
                  coeficientes:
                    type: object
                    properties:
                      "(Intercept)":
                        type: number
                      x:
                        type: number
                  r_quadrado:
                    type: number
                  nome_resposta:
                    type: string
                  nome_preditor:
                    type: string
                  familia:
                    type: string
                    example: "Gaussiana (Normal)"
                  interpretacao:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_gaussiano_grafico:
    post:
      tags: [glm]
      summary: GLM Gaussiano — gráfico HTML
      description: |
        Gráfico do modelo Gaussiano com pontos observados, linha ajustada
        e banda de ±1 desvio padrão dos resíduos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
      responses:
        '200':
          description: Gráfico HTML do modelo Gaussiano
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_gamma:
    post:
      tags: [glm]
      summary: GLM Gamma — JSON
      description: |
        Ajusta um GLM com família Gamma e link logarítmico.
        Apropriado para variáveis resposta **positivas contínuas** cuja variância
        é proporcional ao quadrado da média (ex. biomassa, tempo entre eventos).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
            example:
              y: [2.5, 5.2, 3.8, 6.5, 1.3, 8.8, 4.7, 10.2]
              x: [10, 15, 12, 18, 8, 22, 11, 25]
              nome_y: "Biomassa_kg"
              nome_x: "Area_ha"
      responses:
        '200':
          description: Resultado do modelo Gamma
          content:
            application/json:
              schema:
                type: object
                properties:
                  aic:
                    type: number
                  deviance:
                    type: number
                  coeficientes:
                    type: object
                    properties:
                      "(Intercept)":
                        type: number
                      x:
                        type: number
                  nome_resposta:
                    type: string
                  nome_preditor:
                    type: string
                  familia:
                    type: string
                    example: "Gamma"
                  interpretacao:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_gamma_grafico:
    post:
      tags: [glm]
      summary: GLM Gamma — gráfico HTML
      description: Gráfico do modelo Gamma com pontos observados e curva ajustada (link log).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
      responses:
        '200':
          description: Gráfico HTML do modelo Gamma
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_poisson:
    post:
      tags: [glm]
      summary: GLM Poisson — JSON
      description: |
        Ajusta um GLM com família Poisson e link logarítmico.
        Apropriado para **dados de contagem** (inteiros ≥ 0).
        Reporta a sobredispersão (deviance/gl residual) — se > 1.5, considere Binomial Negativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
            example:
              y: [5, 12, 8, 15, 3, 18, 7, 20]
              x: [10, 15, 12, 18, 8, 22, 11, 25]
              nome_y: "Numero_de_Especies"
              nome_x: "Area_ha"
      responses:
        '200':
          description: Resultado do modelo Poisson
          content:
            application/json:
              schema:
                type: object
                properties:
                  aic:
                    type: number
                  deviance:
                    type: number
                  coeficientes:
                    type: object
                    properties:
                      "(Intercept)":
                        type: number
                      x:
                        type: number
                  sobredispersao:
                    type: number
                    description: Deviance / GL residual. Valores > 1.5 indicam sobredispersão.
                  nome_resposta:
                    type: string
                  nome_preditor:
                    type: string
                  familia:
                    type: string
                    example: "Poisson"
                  interpretacao:
                    type: string
                  nota_sobredispersao:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_poisson_grafico:
    post:
      tags: [glm]
      summary: GLM Poisson — gráfico HTML
      description: |
        Gráfico do modelo Poisson com pontos observados e curva ajustada.
        O subtítulo exibe AIC, sobredispersão e alerta quando sobredispersão > 1.5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
      responses:
        '200':
          description: Gráfico HTML do modelo Poisson
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_binomial_negativa:
    post:
      tags: [glm]
      summary: GLM Binomial Negativa — JSON
      description: |
        Ajusta um GLM de Binomial Negativa via `glm.nb` (MASS).
        Apropriado para dados de contagem com **sobredispersão** (variância > média).
        Reporta o parâmetro theta (dispersão).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
      responses:
        '200':
          description: Resultado do modelo Binomial Negativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  aic:
                    type: number
                  deviance:
                    type: number
                  coeficientes:
                    type: object
                    properties:
                      "(Intercept)":
                        type: number
                      x:
                        type: number
                  theta:
                    type: number
                    description: Parâmetro de dispersão — valores baixos indicam maior sobredispersão.
                  nome_resposta:
                    type: string
                  nome_preditor:
                    type: string
                  familia:
                    type: string
                    example: "Binomial Negativa"
                  interpretacao:
                    type: string
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'

  /analise/modelo_binomial_grafico:
    post:
      tags: [glm]
      summary: GLM Binomial Negativa — gráfico HTML
      description: Gráfico do modelo Binomial Negativa com pontos e curva ajustada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoisVetores'
      responses:
        '200':
          description: Gráfico HTML do modelo Binomial Negativa
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HTMLResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
